name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # net9.0-windows10.0.19041.0 with UseWPF requires a Windows runner. This is
    # not a preference: the target framework will not restore on ubuntu.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Build the solution explicitly rather than the directory, so the build
      # graph is exactly the three projects in UiMcp.sln.
      - run: dotnet restore UiMcp.sln
      - run: dotnet build UiMcp.sln --no-restore -c Release
      - run: dotnet test UiMcp.sln --no-build -c Release --verbosity normal

      # The committed bundle IS the artifact the plugin runs, so a stale one
      # ships silently: nothing else in this repo would notice. Rebuild it here
      # and fail if it differs from what is committed.
      #
      # The flags are load-bearing - a bare `dotnet publish` emits a 156 KB
      # launcher plus ~45 loose DLLs instead of the single-file exe that
      # .mcp.json points at. See README "Build".
      - name: Bundle is not stale
        shell: pwsh
        run: |
          dotnet publish src/UiMcp -c Release -o ${{ runner.temp }}/bundlecheck `
            -r win-x64 --self-contained false -p:PublishSingleFile=true
          $built    = Get-Item "${{ runner.temp }}/bundlecheck/UiMcp.exe"
          $committed = Get-Item "bundle/UiMcp.exe"
          Write-Host "committed: $($committed.Length) bytes"
          Write-Host "rebuilt  : $($built.Length) bytes"
          if ($built.Length -ne $committed.Length) {
            Write-Error @"
          bundle/UiMcp.exe is STALE - a rebuild produces a different artifact.
          Re-publish and commit it, or the plugin keeps serving the previous build:
            dotnet publish src/UiMcp -c Release -o bundle -r win-x64 --self-contained false -p:PublishSingleFile=true
          "@
            exit 1
          }

      # Installed is not serving, and a bundle that starts is not a bundle that
      # works. Drive the artifact over stdio and assert it answers MCP 2.0
      # discovery with the version from Directory.Build.props - the single
      # version source. Catches both a dead binary and a version that did not
      # propagate.
      - name: Artifact answers MCP 2.0 discover
        shell: pwsh
        run: |
          $expected = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          Write-Host "expected version: $expected"
          $psi = [Diagnostics.ProcessStartInfo]::new("bundle/UiMcp.exe")
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($psi)
          $req = '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}'
          $p.StandardInput.WriteLine($req)
          $p.StandardInput.Flush()
          $line = $p.StandardOutput.ReadLine()
          $p.Kill()
          Write-Host "reply: $line"
          $reply = $line | ConvertFrom-Json -Depth 20
          $serverInfo = $reply.result._meta.'io.modelcontextprotocol/serverInfo'
          if ($reply.result.supportedVersions -notcontains '2026-07-28') { Write-Error "server/discover did not advertise MCP 2.0"; exit 1 }
          if (-not $reply.result.capabilities.tools) { Write-Error "server/discover did not advertise tool capability"; exit 1 }
          if (-not $reply.result.instructions) { Write-Error "server/discover did not include server instructions"; exit 1 }
          if (-not $serverInfo) { Write-Error "server/discover did not include serverInfo metadata"; exit 1 }
          if ($serverInfo.name -ne 'ui-mcp') { Write-Error "no ui-mcp serverInfo in the discover reply"; exit 1 }
          if ($serverInfo.version -ne $expected) { Write-Error "artifact did not report version $expected"; exit 1 }

      - name: Artifact lists tools with MCP 2.0 metadata
        shell: pwsh
        run: |
          $meta = '{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}'
          $psi = [Diagnostics.ProcessStartInfo]::new("bundle/UiMcp.exe")
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($psi)
          $req = '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{"_meta":' + $meta + '}}'
          $p.StandardInput.WriteLine($req)
          $p.StandardInput.Flush()
          $line = $p.StandardOutput.ReadLine()
          $p.Kill()
          Write-Host "reply: $line"
          $reply = $line | ConvertFrom-Json -Depth 20
          $tools = $reply.result.tools
          if (-not $tools) { Write-Error "tools/list returned no tools"; exit 1 }
          $names = $tools | ForEach-Object { $_.name }
          foreach ($name in @('ui_open','ui_render','ui_status','ui_close')) {
            if ($names -notcontains $name) { Write-Error "tools/list missing $name"; exit 1 }
          }
          $status = $tools | Where-Object { $_.name -eq 'ui_status' } | Select-Object -First 1
          if (-not $status.title) { Write-Error "ui_status missing title"; exit 1 }
          if (-not $status.annotations.readOnlyHint) { Write-Error "ui_status missing readOnlyHint"; exit 1 }
          if ($status.annotations.idempotentHint -ne $true) { Write-Error "ui_status idempotentHint not true"; exit 1 }
          $render = $tools | Where-Object { $_.name -eq 'ui_render' } | Select-Object -First 1
          if ($render.annotations.idempotentHint -ne $false) { Write-Error "ui_render idempotentHint should be false"; exit 1 }

      - name: Artifact still answers legacy initialize
        shell: pwsh
        run: |
          $expected = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $psi = [Diagnostics.ProcessStartInfo]::new("bundle/UiMcp.exe")
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($psi)
          $req = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          $p.StandardInput.WriteLine($req)
          $p.StandardInput.Flush()
          $line = $p.StandardOutput.ReadLine()
          $p.Kill()
          Write-Host "reply: $line"
          if ($line -notmatch '"name"\s*:\s*"ui-mcp"') { Write-Error "no ui-mcp serverInfo in the legacy initialize reply"; exit 1 }
          if ($line -notmatch [regex]::Escape($expected)) { Write-Error "artifact did not report version $expected"; exit 1 }
